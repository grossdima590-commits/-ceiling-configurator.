<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ceiling Configurator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:1100px;margin:auto;padding:14px}.head{background:#111827;color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
h1{margin:0 0 4px;font-size:22px}.sub{font-size:13px;opacity:.8}.card{background:#fff;border:1px solid #d9dee6;border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input{width:100%;padding:11px;border:1px solid #bcc5d0;border-radius:9px;font-size:17px}button{border:0;border-radius:9px;padding:12px 14px;font-weight:700;background:#111827;color:#fff;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.alt{background:#e8edf3;color:#111827}
.status{padding:10px;border-radius:9px;background:#eef1f5;margin-top:10px;font-size:13px}.ok{background:#e8f7ed;color:#12652e}.bad{background:#fdeaea;color:#991b1b}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tabs button{background:#e9edf2;color:#111827;white-space:nowrap}.tabs .on{background:#111827;color:#fff}
.view{display:none}.view.on{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.stat{background:#eef1f5;border-radius:9px;padding:9px;font-size:12px}.stat strong{display:block;font-size:20px;margin-top:2px}
.canvas{background:#fff;border:1px solid #d9dee6;border-radius:12px;padding:6px;overflow:auto;min-height:400px}svg{display:block;width:100%;height:auto}
.drop{border:2px dashed #b9c2ce;border-radius:10px;padding:14px;text-align:center}.note{font-size:12px;color:#697482;margin-top:8px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="head"><h1>Ceiling Configurator</h1><div class="sub">Раскладка подвесного акустического потолка</div></div>

<div class="card">
<h3>Параметры</h3>
<div class="grid">
<div><label>Ширина помещения, мм</label><input id="rw" type="number" value="6000"></div>
<div><label>Длина помещения, мм</label><input id="rh" type="number" value="4800"></div>
<div><label>Ширина панели, мм</label><input id="pw" type="number" value="1200"></div>
<div><label>Длина панели, мм</label><input id="ph" type="number" value="1200"></div>
<div><label>Зазор, мм</label><input id="gap" type="number" value="3"></div>
<div><label>Отступ крепления, мм</label><input id="mount" type="number" value="400"></div>
</div>
<div class="actions"><button id="build">ПОСТРОИТЬ ЧЕРТЁЖ</button><button id="reset" class="alt">СБРОСИТЬ</button></div>
<div id="status" class="status">Готово.</div>
</div>

<div class="card">
<h3>Тохнит</h3>
<div class="drop">
<input id="planFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp">
<div class="note">Файл остаётся в вашем браузере. На следующем этапе добавим калибровку масштаба.</div>
</div>
<div id="fileInfo" class="status">Тохнит не выбран.</div>
</div>

<div class="card">
<div class="tabs">
<button class="on" data-tab="plan">ПЛАН</button><button data-tab="panel">ПАНЕЛЬ</button><button data-tab="assembly">СБОРКА</button>
</div>
<div id="plan" class="view on">
<div class="stats"><div class="stat">Колонки<strong id="cols">—</strong></div><div class="stat">Ряды<strong id="rows">—</strong></div><div class="stat">Панелей<strong id="total">—</strong></div><div class="stat">Зазор<strong id="gapOut">—</strong></div></div>
<div class="canvas"><svg id="planSvg" viewBox="0 0 1000 800"></svg></div>
</div>
<div id="panel" class="view"><div class="canvas"><svg id="panelSvg" viewBox="0 0 1200 1200"></svg></div></div>
<div id="assembly" class="view"><div class="canvas"><div id="assemblyText" style="padding:20px">Сначала постройте чертёж.</div></div></div>
</div>
</div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const num=id=>Number($(id).value);
const make=(tag,a,t)=>{const e=document.createElementNS(NS,tag);Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));if(t!==undefined)e.textContent=t;return e};
const clear=e=>{while(e.firstChild)e.removeChild(e.firstChild)};
function msg(t,type){$("status").textContent=t;$("status").className="status "+(type||"")}
function build(){
 try{
  const rw=num("rw"),rh=num("rh"),pw=num("pw"),ph=num("ph"),gap=num("gap"),mount=num("mount");
  if([rw,rh,pw,ph].some(x=>!isFinite(x)||x<=0)||gap<0||mount<0)throw Error("Проверьте размеры.");
  const cols=Math.floor((rw+gap)/(pw+gap)),rows=Math.floor((rh+gap)/(ph+gap));
  if(cols<1||rows<1)throw Error("Панель не помещается.");
  const usedW=cols*pw+(cols-1)*gap,usedH=rows*ph+(rows-1)*gap,ox=(rw-usedW)/2,oy=(rh-usedH)/2;
  $("cols").textContent=cols;$("rows").textContent=rows;$("total").textContent=cols*rows;$("gapOut").textContent=gap+" мм";
  const s=$("planSvg");clear(s);s.setAttribute("viewBox",`0 0 ${rw} ${rh}`);s.appendChild(make("rect",{x:0,y:0,width:rw,height:rh,fill:"#fff",stroke:"#111827","stroke-width":12}));
  let i=1;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const x=ox+c*(pw+gap),y=oy+r*(ph+gap),g=make("g",{});
   g.appendChild(make("rect",{x,y,width:pw,height:ph,fill:"#e9edf2",stroke:"#334155","stroke-width":5}));
   [[x+mount,y+mount],[x+pw-mount,y+mount],[x+mount,y+ph-mount],[x+pw-mount,y+ph-mount]].forEach(p=>g.appendChild(make("circle",{cx:p[0],cy:p[1],r:18,fill:"#111827"})));
   g.appendChild(make("text",{x:x+pw/2,y:y+ph/2+20,"text-anchor":"middle","font-size":72,"font-family":"Arial","font-weight":"700"},"P"+String(i++).padStart(2,"0")));
   s.appendChild(g);
  }
  s.appendChild(make("text",{x:rw/2,y:55,"text-anchor":"middle","font-size":52,"font-family":"Arial","font-weight":"700"},`${rw} × ${rh} мм`));
  const p=$("panelSvg");clear(p);p.setAttribute("viewBox",`0 0 ${pw} ${ph}`);p.appendChild(make("rect",{x:0,y:0,width:pw,height:ph,fill:"#f8fafc",stroke:"#111827","stroke-width":10}));
  [[mount,mount,"T1"],[pw-mount,mount,"T2"],[mount,ph-mount,"B1"],[pw-mount,ph-mount,"B2"],[mount,ph/2,"L1"],[pw-mount,ph/2,"R1"],[pw/2,mount,"U1"],[pw/2,ph-mount,"U2"]].forEach(q=>{p.appendChild(make("circle",{cx:q[0],cy:q[1],r:22,fill:"#111827"}));p.appendChild(make("text",{x:q[0]+28,y:q[1]+10,"font-size":32,"font-family":"Arial"},q[2]))});
  p.appendChild(make("text",{x:pw/2,y:ph/2+18,"text-anchor":"middle","font-size":65,"font-family":"Arial","font-weight":"700"},`${pw} × ${ph} мм`));
  $("assemblyText").textContent=`${cols} × ${rows} = ${cols*rows} панелей; зазор ${gap} мм; точки крепления ${mount} мм от края.`;
  msg(`Построено: ${cols} × ${rows} = ${cols*rows} панелей.`,"ok");
 }catch(e){msg("Ошибка: "+e.message,"bad")}
}
$("build").onclick=build;
$("reset").onclick=()=>{["rw","rh","pw","ph","gap","mount"].forEach((id,i)=>$(id).value=[6000,4800,1200,1200,3,400][i]);build()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));b.classList.add("on");$(b.dataset.tab).classList.add("on")});
$("planFile").onchange=e=>{const f=e.target.files[0];if(f){$("fileInfo").textContent="Выбран: "+f.name;$("fileInfo").className="status ok"}};
window.addEventListener("load",build);
})();
</script>
</body></html>
